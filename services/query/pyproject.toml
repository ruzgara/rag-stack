[project]
name = "ragstack-query"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    # Cross-encoder reranker. The macOS arm64 torch wheel includes the MPS
