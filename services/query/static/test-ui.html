<!doctype html>
<!-- Temporary test UI for the query API. Served at /ui by api.py. Not the real UI. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-stack test UI</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#6b6b6b; --line:#e2e2e2; --soft:#f5f5f4; --accent:#2f5bd3; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#e8e8e8; --muted:#9a9a9a; --line:#2e2e2e; --soft:#202020; --accent:#7ea0ff; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:grid; grid-template-columns:240px 1fr 340px; }
  aside, main, section { overflow:auto; }
  aside { border-right:1px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:8px; }
  section { border-left:1px solid var(--line); padding:12px; }
  main { display:flex; flex-direction:column; }
  button, select, input, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  button { cursor:pointer; } button:hover { background:var(--soft); }
  .conv { padding:6px 8px; border-radius:6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv:hover, .conv.active { background:var(--soft); }
  .conv .del { float:right; color:var(--muted); visibility:hidden; } .conv:hover .del { visibility:visible; }
  #log { flex:1; overflow:auto; padding:16px 20px; }
  .msg { margin:0 0 18px; max-width:820px; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:2px; }
  .msg .body { white-space:pre-wrap; }
  .msg.user .body { background:var(--soft); padding:8px 12px; border-radius:8px; display:inline-block; }
  .events { font-size:12px; color:var(--muted); margin:2px 0 6px; }
  .cite { color:var(--accent); cursor:pointer; font-weight:600; }
  .err { color:var(--err); }
  details.think { font-size:12px; color:var(--muted); margin-bottom:6px; } details.think pre { white-space:pre-wrap; margin:4px 0; }
  form#ask { display:flex; gap:8px; padding:12px 20px; border-top:1px solid var(--line); }
  form#ask textarea { flex:1; resize:vertical; min-height:44px; }
  .src { border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:8px; font-size:13px; }
  .src.cited { border-color:var(--accent); } .src.flash { outline:2px solid var(--accent); }
  .src .meta { font-size:12px; color:var(--muted); } .src .text { white-space:pre-wrap; max-height:220px; overflow:auto; margin-top:4px; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:8px 0; }
  .row { display:flex; gap:6px; align-items:center; } .small { font-size:12px; color:var(--muted); }
  @media (max-width: 900px) { body { grid-template-columns:1fr; grid-template-rows:auto 1fr auto; height:auto; } aside, section { border:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <div class="small"><b>rag-stack</b> · temporary test UI</div>
  <div class="row"><button id="new">+ New chat</button>
    <select id="preset"><option>everyday</option><option>hard</option></select></div>
  <div id="convs"></div>
  <h3>Libraries</h3>
  <div id="libs" class="small">Sign in to see libraries.</div>
  <div class="row" id="libAdminRow" style="display:none"><button id="newLib">+ New library</button></div>
  <h3>Documents</h3>
  <div class="row"><input type="file" id="file" multiple style="max-width:100%">
    <select id="uploadLib"><option value="">(no library)</option></select></div>
  <div id="docs" class="small"></div>
  <h3>Account</h3>
  <div id="who" class="small"></div>
  <form id="signin" class="row" style="display:none;flex-direction:column;align-items:stretch">
    <input id="email" type="email" placeholder="you@example.com" class="small" autocomplete="username">
    <input id="password" type="password" placeholder="password" class="small" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <button id="signout" style="display:none">Sign out</button>
  <h3>API key</h3>
  <input id="key" placeholder="QUERY_API_KEY, for scripts" class="small">
  <div id="health" class="small"></div>
</aside>
<main>
  <div id="log"><p class="small">Start a new chat, or pick one on the left.</p></div>
  <form id="ask"><textarea id="q" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)"></textarea><button>Send</button></form>
</main>
<section><h3>Sources</h3><div id="sources" class="small">Sources of the selected answer appear here.</div></section>

<script>
const $ = s => document.querySelector(s);
let convId = null, busy = false;
const keyInput = $("#key");
try { keyInput.value = localStorage.getItem("ragKey") || ""; } catch {}
keyInput.onchange = () => { try { localStorage.setItem("ragKey", keyInput.value); } catch {} refresh(); };

function headers(json = true) {
  const h = json ? {"content-type": "application/json"} : {};
  if (keyInput.value) h.authorization = "Bearer " + keyInput.value;
  return h;
}
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {...headers(!(opts.body instanceof FormData)), ...(opts.headers || {})}});
  if (!r.ok && r.status !== 204) throw new Error(`${r.status}: ${await r.text()}`);
  return r.status === 204 ? null : r.json();
}
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// Render text with clickable [n] / [1-3] / [1, 2] citations.
function renderAnswer(el, text, sources) {
  el.innerHTML = esc(text).replace(/\[(\d+(?:\s*[-–,;]\s*\d+)*)\]/g, (m, inner) =>
    `<span class="cite" data-n="${inner.match(/\d+/)[0]}">${m}</span>`);
  el.querySelectorAll(".cite").forEach(c => c.onclick = () => showSources(sources, +c.dataset.n));
}

function showSources(sources, focus) {
  const box = $("#sources");
  if (!sources || !sources.length) { box.textContent = "No sources."; return; }
  box.innerHTML = "";
  for (const s of sources) {
    const d = document.createElement("div");
    d.className = "src" + (s.cited ? " cited" : "");
    const pages = s.pages && s.pages.length ? " · p. " + (s.pages.length > 1 ? `${s.pages[0]}–${s.pages.at(-1)}` : s.pages[0]) : "";
    const score = s.rerank_score != null ? ` · score ${s.rerank_score.toFixed(2)}` : "";
    d.innerHTML = `<b>[${s.number}]</b> ${esc(s.filename)}${pages}
      <div class="meta">${esc((s.headings || []).join(" › "))}${score} · ${s.found_by}${s.cited ? " · cited" : ""}</div>
      <div class="text">${esc(s.text)}</div>`;
    box.appendChild(d);
    if (s.number === focus) { d.classList.add("flash"); setTimeout(() => d.scrollIntoView({block: "nearest"}), 0); }
  }
}

function addMsg(role, text = "") {
  const m = document.createElement("div");
  m.className = "msg " + role;
  m.innerHTML = `<div class="who">${role === "user" ? "You" : "Assistant"}</div><div class="events"></div><div class="body"></div>`;
  m.querySelector(".body").textContent = text;
  $("#log").appendChild(m);
  $("#log").scrollTop = $("#log").scrollHeight;
  return m;
}

async function loadConvs() {
  const list = await api("/api/conversations");
  const box = $("#convs"); box.innerHTML = "";
  for (const c of list) {
    const d = document.createElement("div");
    d.className = "conv" + (c.id === convId ? " active" : "");
    d.innerHTML = `<span class="del" title="Delete">✕</span>${esc(c.title || "Untitled")} <span class="small">· ${c.preset}</span>`;
    d.onclick = () => openConv(c.id);
    d.querySelector(".del").onclick = async e => {
      e.stopPropagation();
      if (!confirm("Delete this conversation?")) return;
      await api(`/api/conversations/${c.id}`, {method: "DELETE"});
      if (convId === c.id) { convId = null; $("#log").innerHTML = ""; }
      loadConvs();
    };
    box.appendChild(d);
  }
}

async function openConv(id) {
  convId = id;
  const c = await api(`/api/conversations/${id}`);
  $("#preset").value = c.preset;
  convLibraryIds = c.library_ids || [];
  renderLibraries();
  $("#log").innerHTML = "";
  let last = null;
  for (const m of c.messages) {
    const el = addMsg(m.role);
    if (m.role === "assistant") {
      renderAnswer(el.querySelector(".body"), m.content, m.sources);
      const s = m.stats || {};
      el.querySelector(".events").innerHTML =
        (m.status !== "complete" ? `<span class="err">${m.status}: ${esc(m.error || "")}</span> · ` : "") +
        ((m.search_queries || []).length ? `searched: ${esc(m.search_queries.join(" | "))}` : "no search") + (s.total_s ? ` · ${s.total_s}s` : "");
      el.onclick = () => showSources(m.sources);
      last = m;
    } else el.querySelector(".body").textContent = m.content;
  }
  if (last) showSources(last.sources);
  loadConvs();
}

async function send(text) {
  if (busy) return;
  busy = true;
  try {
    if (!convId) {
      const c = await api("/api/conversations", {method: "POST",
        body: JSON.stringify({preset: $("#preset").value, library_ids: convLibraryIds.length ? convLibraryIds : null})});
      convId = c.id; loadConvs();
    }
    addMsg("user", text);
    const el = addMsg("assistant"), body = el.querySelector(".body"), events = el.querySelector(".events");
    let answer = "", sources = [], thinking = null;
    const log = t => { events.textContent += (events.textContent ? " · " : "") + t; };
    const r = await fetch(`/api/conversations/${convId}/messages`, {method: "POST", headers: headers(),
      body: JSON.stringify({content: text, preset: $("#preset").value})});
    if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (block.match(/^event: (.*)$/m) || [])[1], data = JSON.parse((block.match(/^data: (.*)$/m) || [])[1] || "{}");
        if (ev === "token") { answer += data.text; body.textContent = answer; }
        else if (ev === "thinking") {
          if (!thinking) { const d = document.createElement("details"); d.className = "think";
            d.innerHTML = "<summary>thinking…</summary><pre></pre>"; el.insertBefore(d, body); thinking = d.querySelector("pre"); }
          thinking.textContent += data.text;
        }
        else if (ev === "queued") log(`waiting for a free slot (position ${data.position})`);
        else if (ev === "rewrite") log(data.search ? `rewritten: “${data.query}”` : "no search needed");
        else if (ev === "searching") log(`${data.found_by === "tool" ? "tool search" : "search"}: “${data.query}”`);
        else if (ev === "listing") log(data.document ? `looking up document: “${data.document}”` : "listing the knowledge base");
        else if (ev === "listing_libraries") log("listing libraries");
        else if (ev === "sources") { sources.push(...data.sources); showSources(sources); }
        else if (ev === "done") {
          renderAnswer(body, data.answer, data.sources); showSources(data.sources);
          el.onclick = () => showSources(data.sources);
          const s = data.stats;
          log(`${s.total_s}s total, first token ${s.first_token_s}s, ${s.tool_rounds} tool round(s)` +
              (data.invalid_citations.length ? `, invalid citations ${data.invalid_citations}` : ""));
        }
        else if (ev === "title") loadConvs();
        else if (ev === "error") { const e = document.createElement("div"); e.className = "err"; e.textContent = data.error; el.appendChild(e); }
        $("#log").scrollTop = $("#log").scrollHeight;
      }
    }
  } catch (e) { addMsg("assistant").querySelector(".body").innerHTML = `<span class="err">${esc(String(e.message || e))}</span>`; }
  finally { busy = false; }
}

async function loadDocs() {
  try {
    const d = await api("/api/documents");
    const ing = d.ingest;
    $("#docs").innerHTML = d.documents.map(x => `• ${esc(x.filename)} <i>(${x.status}${x.pages ? ", " + x.pages + " p." : ""})</i>`).join("<br>")
      + (d.inbox.length ? `<br>In inbox: ${d.inbox.map(esc).join(", ")}` : "")
      + (ing.running ? "<br><b>Ingesting…</b>" : "")
      + (ing.last_run && ing.last_run.exit_code ? `<br><span class="err">Last ingest failed (exit ${ing.last_run.exit_code}), see data/logs/ingest-api.log</span>` : "");
    if (ing.running || ing.pending) setTimeout(loadDocs, 3000);
  } catch (e) { $("#docs").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

// --------------------------------------------------------------- libraries --

let libraries = [], convLibraryIds = [], isLibrariesAdmin = false;

async function loadLibraries() {
  try {
    libraries = (await api("/api/libraries")).libraries;
  } catch (e) { $("#libs").innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
  renderLibraries();
  const sel = $("#uploadLib");
  sel.innerHTML = `<option value="">(no library)</option>` +
    libraries.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
}

function renderLibraries() {
  const box = $("#libs");
  if (!libraries.length) { box.textContent = "No libraries yet."; return; }
  box.innerHTML = libraries.map(l => `
    <div class="row" data-lib="${l.id}">
      <input type="checkbox" ${convLibraryIds.includes(l.id) ? "checked" : ""}>
      <span title="${esc(l.description || "")}">${esc(l.name)} <span class="small">(${l.document_count})</span></span>
      ${isLibrariesAdmin ? '<span class="del small" style="visibility:visible;cursor:pointer" title="Delete">✕</span>' : ""}
    </div>`).join("");
  box.querySelectorAll("[data-lib]").forEach(row => {
    const id = row.dataset.lib;
    row.querySelector("input").onchange = e => {
      convLibraryIds = e.target.checked ? [...convLibraryIds, id] : convLibraryIds.filter(x => x !== id);
      if (convId) api(`/api/conversations/${convId}`, {method: "PATCH", body: JSON.stringify({library_ids: convLibraryIds})}).catch(e => alert(e.message));
    };
    const del = row.querySelector(".del");
    if (del) del.onclick = async () => {
      if (!confirm(`Delete library "${libraries.find(l => l.id === id).name}"?`)) return;
      try { await api(`/api/admin/libraries/${id}`, {method: "DELETE"}); convLibraryIds = convLibraryIds.filter(x => x !== id); loadLibraries(); }
      catch (e) { alert(e.message); }
    };
  });
}

$("#newLib").onclick = async () => {
  const name = prompt("Library name:");
  if (!name) return;
  const description = prompt("Description (optional):") || null;
  try { await api("/api/admin/libraries", {method: "POST", body: JSON.stringify({name, description})}); loadLibraries(); }
  catch (e) { alert(e.message); }
};

async function health() {
  try {
    const r = await fetch("/api/health"), h = await r.json();
    const q = h.qdrant.ok ? `${h.qdrant.chunks} chunks` : "Qdrant: " + h.qdrant.error;
    const rr = h.reranker ? (h.reranker.device ? `reranker on ${h.reranker.device}` : "reranker loading") : "";
    $("#health").innerHTML = (h.ok ? "✓ healthy" : '<span class="err">✗ unhealthy</span>') + ` · ${esc(q)} · ${rr}`;
  } catch { $("#health").innerHTML = '<span class="err">API unreachable</span>'; }
}

$("#new").onclick = () => { convId = null; convLibraryIds = []; renderLibraries(); $("#log").innerHTML = ""; $("#sources").textContent = ""; loadConvs(); $("#q").focus(); };
$("#preset").onchange = () => { if (convId) api(`/api/conversations/${convId}`, {method: "PATCH", body: JSON.stringify({preset: $("#preset").value})}).then(loadConvs); };
$("#ask").onsubmit = e => { e.preventDefault(); const t = $("#q").value.trim(); if (t) { $("#q").value = ""; send(t); } };
$("#q").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#ask").requestSubmit(); } };
$("#file").onchange = async () => {
  const fd = new FormData(); for (const f of $("#file").files) fd.append("files", f);
  if ($("#uploadLib").value) fd.append("library_id", $("#uploadLib").value);
  try {
    const r = await api("/api/upload", {method: "POST", body: fd});
    alert(`Saved: ${r.saved.join(", ") || "none"}\n${r.rejected.map(x => x.filename + ": " + x.reason).join("\n")}\nIngest: ${r.ingest}`);
  } catch (e) { alert(e.message); }
  $("#file").value = ""; loadDocs();
};
// The session cookie is set by /api/auth/login and sent automatically; the
// API-key field is only for standing in for a script.
async function whoami() {
  try {
    const me = await api("/api/auth/me");
    const perms = Object.keys(me.permissions).sort().join(", ") || "no permissions yet";
    $("#who").innerHTML = `<b>${esc(me.user.email)}</b>${me.user.is_admin ? " (admin)" : ""}<br>` +
      `${esc(me.user.groups.join(", ") || "no groups")}<br><span class="small">${esc(perms)}</span>`;
    $("#signin").style.display = "none";
    $("#signout").style.display = "";
    isLibrariesAdmin = me.user.is_admin || !!me.permissions["libraries.manage"];
    $("#libAdminRow").style.display = isLibrariesAdmin ? "" : "none";
    return me;
  } catch {
    $("#who").textContent = "Not signed in.";
    $("#signin").style.display = "flex";
    $("#signout").style.display = "none";
    return null;
  }
}
$("#signin").onsubmit = async e => {
  e.preventDefault();
  try {
    await api("/api/auth/login", {method: "POST",
      body: JSON.stringify({email: $("#email").value, password: $("#password").value})});
    $("#password").value = "";
    refresh();
  } catch (err) { $("#who").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
};
$("#signout").onclick = async () => {
  await api("/api/auth/logout", {method: "POST"});
  convId = null; $("#log").innerHTML = ""; $("#convs").innerHTML = "";
  refresh();
};

async function refresh() {
  if (!await whoami()) return;   // nothing else works until someone is signed in
  loadConvs().catch(e => $("#convs").innerHTML = `<span class="err">${esc(e.message)}</span>`);
  loadLibraries();
  loadDocs();
  health();
}
refresh(); setInterval(health, 15000);
</script>
</body>
</html>
