[project]
name = "ragstack-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    # Page triage (text vs scan) and rendering for orientation detection.
    # Same major as the docling-serve env.
    "pypdfium2>=5.13,<6",
    "pillow>=11,<13",  # pypdfium2 renders to PIL images for tesseract
    "python-dotenv>=1.0,<2",
    # Heading levels (headings.py): style measurement on rendered pages, and
    # re-exporting the markdown from the corrected DoclingDocument.
    "numpy>=2,<3",
    "docling-core>=2.97,<3",
]

[tool.uv]
package = false

# Unit tests: `uv run pytest` in this directory, or ./run-tests.sh at the
# repo root for every service. No services, network or data/ needed.
[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests needing docling-serve (the OCR route end to end); they skip
# themselves when it isn't running. Deselect with -m "not integration".
markers = ["integration: needs docling-serve running (./ragctl up)"]
