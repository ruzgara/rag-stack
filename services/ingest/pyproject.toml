[project]
name = "ragstack-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    # Page triage (text vs scan) and rendering for orientation detection.
    # Same major as the docling-serve env.
    "pypdfium2>=5.13,<6",
    "pillow>=11,<13",  # pypdfium2 renders to PIL images for tesseract
    "python-dotenv>=1.0,<2",
]

[tool.uv]
package = false
